# LLM Configuration
llm:
  base_url: "http://localhost:11434/v1"  # Ollama default port
  
  # Model selection by task
  models:
    reasoning: "deepseek-r1:70b"  # For intent extraction and planning
    coding: "qwen2.5-coder:32b"   # For code generation and repair
  temperature: 0.4

# Paths
paths:
  draft_dir: "./tools/draft"
  staged_dir: "./tools/staged"
  active_dir: "./tools/active"
  registry: "./registry/tools.json"
  sandbox_workspace: "./tools/sandbox"

# Validation
validation:
  max_repair_attempts: 5
  sandbox_timeout_seconds: 300

# Sandbox
sandbox:
  # mode: "subprocess"  # or "docker"
  mode: "docker"
  timeout_seconds: 300  # Increased for Docker container startup
  memory_limit_mb: 512

# Logging
logging:
  level: "INFO"
  file: "./logs/pipeline.log"

# Multi-user API server (run with: python -m src.server)
server:
  host: "0.0.0.0"           # bind on all interfaces so other machines can reach it
  port: 8000
  max_concurrent_pipelines: 2   # how many pipeline runs share the GPU at once
                                 # raise only if VRAM allows parallel inference
  job_ttl_seconds: 3600         # how long to keep finished job records in memory
