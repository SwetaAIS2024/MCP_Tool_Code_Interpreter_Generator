[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-tool-generator"
version = "1.0.0"
description = "Autonomous MCP tool generator using LangGraph and Qwen LLM"
authors = [{name = "Your Name", email = "your.email@example.com"}]
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=0.2.0",
    "langgraph>=0.2.0",
    "langsmith>=0.1.0",
    "pydantic>=2.5.0",
    "openai>=1.3.0",
    "pandas>=2.0.0",
    "PyYAML>=6.0",
    "black>=23.0.0",
    "a2a-sdk>=0.3.25",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "langgraph-cli[inmem]>=0.1.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

# Ensure src/ and integration/ are discovered when installed via pip install -e .
# This makes `from src.pipeline import build_graph` work in the A2A server repo.
[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "integration*"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
